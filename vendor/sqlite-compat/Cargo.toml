[package]
name = "libsqlite3-sys"
version = "0.30.1"
edition = "2024"
license = "BUSL-1.1"
publish = false
rust-version = "1.95"

[features]
default = ["min_sqlite_version_3_14_0"]
min_sqlite_version_3_14_0 = ["libsqlite3-sys-upstream/min_sqlite_version_3_45_3"]
bundled = ["libsqlite3-sys-upstream/bundled"]
bundled_bindings = ["libsqlite3-sys-upstream/bundled_bindings"]
pkg-config = ["libsqlite3-sys-upstream/pkg-config"]
unlock_notify = ["libsqlite3-sys-upstream/unlock_notify"]
vcpkg = ["libsqlite3-sys-upstream/vcpkg"]

[dependencies]
libsqlite3-sys-upstream = { package = "libsqlite3-sys", version = "=0.39.1", default-features = false }

[lints.rust]
non_ascii_idents = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unused_lifetimes = "warn"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_add = "deny"
string_lit_as_bytes = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
verbose_file_reads = "deny"
