syntax = "proto3";

package maestro.v1;

import "google/protobuf/struct.proto";

// Bootstrap protobuf schema for the headless protocol.
//
// This mirrors the current message surface closely enough for code generation and
// cross-language drift checks, while the live runtime continues to use the
// existing JSON transport until follow-up slices migrate the transport layer.
// protocol-version: 2026-08-08

enum CodeMode {
  CODE_MODE_UNSPECIFIED = 0;
  CODE_MODE_GOVERNED_CODE = 1;
}

enum ServerRequestType {
  SERVER_REQUEST_TYPE_UNSPECIFIED = 0;
  SERVER_REQUEST_TYPE_APPROVAL = 1;
  SERVER_REQUEST_TYPE_CLIENT_TOOL = 2;
  SERVER_REQUEST_TYPE_MCP_ELICITATION = 3;
  SERVER_REQUEST_TYPE_USER_INPUT = 4;
  SERVER_REQUEST_TYPE_TOOL_RETRY = 5;
}

enum ServerRequestResolution {
  SERVER_REQUEST_RESOLUTION_UNSPECIFIED = 0;
  SERVER_REQUEST_RESOLUTION_APPROVED = 1;
  SERVER_REQUEST_RESOLUTION_DENIED = 2;
  SERVER_REQUEST_RESOLUTION_COMPLETED = 3;
  SERVER_REQUEST_RESOLUTION_FAILED = 4;
  SERVER_REQUEST_RESOLUTION_ANSWERED = 5;
  SERVER_REQUEST_RESOLUTION_RETRIED = 6;
  SERVER_REQUEST_RESOLUTION_SKIPPED = 7;
  SERVER_REQUEST_RESOLUTION_ABORTED = 8;
  SERVER_REQUEST_RESOLUTION_CANCELLED = 9;
}

enum ServerRequestResolvedBy {
  SERVER_REQUEST_RESOLVED_BY_UNSPECIFIED = 0;
  SERVER_REQUEST_RESOLVED_BY_USER = 1;
  SERVER_REQUEST_RESOLVED_BY_POLICY = 2;
  SERVER_REQUEST_RESOLVED_BY_CLIENT = 3;
  SERVER_REQUEST_RESOLVED_BY_RUNTIME = 4;
}

enum ToolRetryDecisionAction {
  TOOL_RETRY_DECISION_ACTION_UNSPECIFIED = 0;
  TOOL_RETRY_DECISION_ACTION_RETRY = 1;
  TOOL_RETRY_DECISION_ACTION_SKIP = 2;
  TOOL_RETRY_DECISION_ACTION_ABORT = 3;
}

enum DelegationEventKind {
  DELEGATION_EVENT_KIND_UNSPECIFIED = 0;
  DELEGATION_EVENT_KIND_PROGRESS = 1;
  DELEGATION_EVENT_KIND_NEEDS_ATTENTION = 2;
  DELEGATION_EVENT_KIND_APPROVAL_REQUIRED = 3;
  DELEGATION_EVENT_KIND_CONTROL = 4;
  DELEGATION_EVENT_KIND_COMPLETION = 5;
  DELEGATION_EVENT_KIND_UNAVAILABLE = 6;
}

enum DelegationLifecycleState {
  DELEGATION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  DELEGATION_LIFECYCLE_STATE_QUEUED = 1;
  DELEGATION_LIFECYCLE_STATE_ACTIVE = 2;
  DELEGATION_LIFECYCLE_STATE_NEEDS_ATTENTION = 3;
  DELEGATION_LIFECYCLE_STATE_APPROVAL_REQUIRED = 4;
  DELEGATION_LIFECYCLE_STATE_PAUSED = 5;
  DELEGATION_LIFECYCLE_STATE_RESUMED = 6;
  DELEGATION_LIFECYCLE_STATE_CANCELLED = 7;
  DELEGATION_LIFECYCLE_STATE_COMPLETED = 8;
  DELEGATION_LIFECYCLE_STATE_FAILED = 9;
  DELEGATION_LIFECYCLE_STATE_UNAVAILABLE = 10;
}

enum DelegationControlAction {
  DELEGATION_CONTROL_ACTION_UNSPECIFIED = 0;
  DELEGATION_CONTROL_ACTION_APPROVE = 1;
  DELEGATION_CONTROL_ACTION_STEER = 2;
  DELEGATION_CONTROL_ACTION_FOLLOWUP = 3;
  DELEGATION_CONTROL_ACTION_COLLECT = 4;
  DELEGATION_CONTROL_ACTION_INTERRUPT = 5;
  DELEGATION_CONTROL_ACTION_PAUSE = 6;
  DELEGATION_CONTROL_ACTION_RESUME = 7;
  DELEGATION_CONTROL_ACTION_CANCEL = 8;
  DELEGATION_CONTROL_ACTION_RETRY = 9;
  DELEGATION_CONTROL_ACTION_REQUEST_REVIEW = 10;
  DELEGATION_CONTROL_ACTION_RERUN_CHECKS = 11;
}

enum DelegationControlState {
  DELEGATION_CONTROL_STATE_UNSPECIFIED = 0;
  DELEGATION_CONTROL_STATE_REQUESTED = 1;
  DELEGATION_CONTROL_STATE_ACCEPTED = 2;
  DELEGATION_CONTROL_STATE_APPLIED = 3;
  DELEGATION_CONTROL_STATE_REJECTED = 4;
  DELEGATION_CONTROL_STATE_UNAVAILABLE = 5;
}

enum ConnectionRole {
  CONNECTION_ROLE_UNSPECIFIED = 0;
  CONNECTION_ROLE_VIEWER = 1;
  CONNECTION_ROLE_CONTROLLER = 2;
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_STATUS = 1;
  NOTIFICATION_TYPE_HEARTBEAT = 2;
  NOTIFICATION_TYPE_CONNECTION_INFO = 3;
  NOTIFICATION_TYPE_COMPACTION = 4;
}

enum ThinkingLevel {
  THINKING_LEVEL_UNSPECIFIED = 0;
  THINKING_LEVEL_OFF = 1;
  THINKING_LEVEL_MINIMAL = 2;
  THINKING_LEVEL_LOW = 3;
  THINKING_LEVEL_MEDIUM = 4;
  THINKING_LEVEL_HIGH = 5;
  THINKING_LEVEL_ULTRA = 6;
  // Anthropic's xhigh effort. Added after ULTRA, so the field number order
  // does not follow the effort ladder; wire compatibility wins over tidiness.
  THINKING_LEVEL_XHIGH = 7;
}

enum ApprovalMode {
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_AUTO = 1;
  APPROVAL_MODE_PROMPT = 2;
  APPROVAL_MODE_FAIL = 3;
}

enum ControllerLifetimeProfile {
  CONTROLLER_LIFETIME_PROFILE_UNSPECIFIED = 0;
  CONTROLLER_LIFETIME_PROFILE_EPHEMERAL = 1;
  CONTROLLER_LIFETIME_PROFILE_RESIDENT = 2;
}

message ControllerContext {
  string schema_version = 1;
  string controller_id = 2;
  string organization_id = 3;
  string workspace_id = 4;
  string thread_id = 5;
  optional string channel_id = 6;
  optional string request_id = 7;
  ControllerLifetimeProfile lifetime_profile = 8;
  optional uint64 runtime_generation = 9;
}

enum ExecutorType {
  EXECUTOR_TYPE_UNSPECIFIED = 0;
  EXECUTOR_TYPE_LIVE = 1;
  EXECUTOR_TYPE_REPLAY = 2;
}

enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_TRANSIENT = 1;
  ERROR_TYPE_FATAL = 2;
  ERROR_TYPE_TOOL = 3;
  ERROR_TYPE_CANCELLED = 4;
  ERROR_TYPE_PROTOCOL = 5;
}

enum UtilityOperation {
  UTILITY_OPERATION_UNSPECIFIED = 0;
  UTILITY_OPERATION_COMMAND_EXEC = 1;
  UTILITY_OPERATION_FILE_SEARCH = 2;
  UTILITY_OPERATION_FILE_WATCH = 3;
  UTILITY_OPERATION_FILE_READ = 4;
}

enum UtilityCommandStream {
  UTILITY_COMMAND_STREAM_UNSPECIFIED = 0;
  UTILITY_COMMAND_STREAM_STDOUT = 1;
  UTILITY_COMMAND_STREAM_STDERR = 2;
}

enum UtilityCommandShellMode {
  UTILITY_COMMAND_SHELL_MODE_UNSPECIFIED = 0;
  UTILITY_COMMAND_SHELL_MODE_SHELL = 1;
  UTILITY_COMMAND_SHELL_MODE_DIRECT = 2;
}

enum UtilityCommandTerminalMode {
  UTILITY_COMMAND_TERMINAL_MODE_UNSPECIFIED = 0;
  UTILITY_COMMAND_TERMINAL_MODE_PIPE = 1;
  UTILITY_COMMAND_TERMINAL_MODE_PTY = 2;
}

enum UtilityFileWatchChangeType {
  UTILITY_FILE_WATCH_CHANGE_TYPE_UNSPECIFIED = 0;
  UTILITY_FILE_WATCH_CHANGE_TYPE_CREATE = 1;
  UTILITY_FILE_WATCH_CHANGE_TYPE_MODIFY = 2;
  UTILITY_FILE_WATCH_CHANGE_TYPE_DELETE = 3;
  UTILITY_FILE_WATCH_CHANGE_TYPE_RENAME = 4;
}

message ClientInfo {
  string name = 1;
  optional string version = 2;
}

message ClientCapabilities {
  repeated ServerRequestType server_requests = 1;
  repeated UtilityOperation utility_operations = 2;
  optional bool raw_agent_events = 3;
  optional bool governed_code_mode = 4;
}

message ClientToolExecutionOwner {
  string client_instance_id = 1;
  uint64 lease_epoch = 2;
}

message ExternalToolDefinition {
  string tool_id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Value input_schema = 4;
  ClientToolExecutionOwner execution_owner = 5;
  google.protobuf.Value metadata = 6;
  optional string connection_binding_id = 7;
}

message ConnectionGrantBinding {
  string binding_id = 1;
  string connection_id = 2;
  string provider_id = 3;
  uint64 generation = 4;
  string placement = 5;
  repeated string capabilities = 6;
  repeated string resources = 7;
  string policy_hash = 8;
}

message GovernedToolGrant {
  uint32 envelope_version = 1;
  string grant_id = 2;
  uint64 grant_version = 3;
  string issuer = 4;
  string audience = 5;
  string organization_id = 6;
  string workspace_id = 7;
  string thread_id = 8;
  string turn_id = 9;
  string run_id = 10;
  uint64 runtime_generation = 11;
  uint64 grant_epoch = 12;
  int64 issued_at_ms = 13;
  int64 not_before_ms = 14;
  int64 expires_at_ms = 15;
  string grant_hash = 16;
  string signing_key_id = 17;
  string grant_signature = 18;
  repeated string native_tool_ids = 19;
  repeated ExternalToolDefinition external_tools = 20;
  repeated ConnectionGrantBinding connection_bindings = 21;
}

message NativeToolCapability {
  string name = 1;
  bool requires_approval = 2;
  optional string version = 3;
}

message ServerCapabilities {
  repeated ServerRequestType server_requests = 1;
  repeated UtilityOperation utility_operations = 2;
  optional bool raw_agent_events = 3;
  repeated ConnectionRole connection_roles = 4;
  repeated NativeToolCapability native_tools = 5;
  repeated string governed_tool_grant_algorithms = 6;
}

message ToolResponseResult {
  bool success = 1;
  string output = 2;
  optional string error = 3;
}

message TextContent {
  string text = 1;
}

message ImageContent {
  string data = 1;
  string mime_type = 2;
}

message ContentBlock {
  oneof content {
    TextContent text = 1;
    ImageContent image = 2;
  }
}

message ResponseUsage {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 cache_read_tokens = 3;
  uint32 cache_write_tokens = 4;
  uint32 total_tokens = 5;
  double total_cost_usd = 6;
  string model_id = 7;
  string provider = 8;
}

message ToolsSummary {
  repeated string tools_used = 1;
  uint32 calls_succeeded = 2;
  uint32 calls_failed = 3;
  repeated string summary_labels = 4;
}

message UtilityFileSearchMatch {
  string path = 1;
  double score = 2;
}

message ConnectionState {
  string connection_id = 1;
  ConnectionRole role = 2;
  optional string client_protocol_version = 3;
  ClientInfo client_info = 4;
  ClientCapabilities capabilities = 5;
  repeated NotificationType opt_out_notifications = 6;
  uint32 subscription_count = 7;
  uint32 attached_subscription_count = 8;
  bool controller_lease_granted = 9;
  optional string lease_expires_at = 10;
}

message HelloMessage {
  optional string protocol_version = 1;
  ClientInfo client_info = 2;
  ClientCapabilities capabilities = 3;
  optional ConnectionRole role = 4;
  repeated NotificationType opt_out_notifications = 5;
  optional string controller_binding_version = 6;
  ControllerContext controller_context = 7;
  google.protobuf.Value capability_manifest = 8;
}

// Prior conversation turn seeded before the first prompt.
// role is one of: "user", "assistant", "system".
message HistoryMessage {
  string role = 1;
  string content = 2;
}

message InitMessage {
  optional string system_prompt = 1;
  optional string append_system_prompt = 2;
  optional ThinkingLevel thinking_level = 3;
  optional ApprovalMode approval_mode = 4;
  // Optional multi-turn conversation history applied before the first prompt.
  // Prefer this over stuffing prior turns into append_system_prompt.
  repeated HistoryMessage history = 5;
}

message GovernedInitMessage {
  optional string system_prompt = 1;
  optional string append_system_prompt = 2;
  optional ThinkingLevel thinking_level = 3;
  optional ApprovalMode approval_mode = 4;
  repeated HistoryMessage history = 5;
  CodeMode code_mode = 6;
  GovernedToolGrant tool_grant = 7;
}

message PromptMessage {
  string content = 1;
  repeated string attachments = 2;
}

message GovernedPromptMessage {
  string content = 1;
  repeated string attachments = 2;
  CodeMode code_mode = 3;
  GovernedToolGrant tool_grant = 4;
}

message InterruptMessage {}

message ToolResponseMessage {
  string call_id = 1;
  bool approved = 2;
  ToolResponseResult result = 3;
  optional string tool_execution_id = 4;
}

message ClientToolResultMessage {
  string call_id = 1;
  repeated ContentBlock content = 2;
  bool is_error = 3;
}

message GovernedClientToolResultMessage {
  string call_id = 1;
  repeated ContentBlock content = 2;
  bool is_error = 3;
  string tool_execution_id = 4;
  string client_instance_id = 5;
  string grant_id = 6;
  uint64 grant_version = 7;
  string grant_hash = 8;
  string definition_digest = 9;
  string args_digest = 10;
  uint64 owner_lease_epoch = 11;
  string idempotency_key = 12;
  string turn_digest = 13;
}

message WorkspacePromptCapability {
  string qualified_id = 1;
  string name = 2;
  string scope = 3;
  string revision_digest = 4;
  string body_digest = 5;
  repeated string trigger_patterns = 6;
  bool user_invocable = 7;
  bool pinned_prompt_only = 8;
  string title = 9;
  string description = 10;
  repeated string instructions = 11;
  string body = 12;
  string entry_digest = 13;
}

message ApplyWorkspaceCapabilitySetMessage {
  string organization_id = 1;
  string workspace_id = 2;
  string runner_session_id = 3;
  uint64 runtime_generation = 4;
  uint64 activation_generation = 5;
  string workspace_snapshot_digest = 6;
  string workspace_skill_set_digest = 7;
  string capability_set_digest = 8;
  repeated string workspace_instructions = 9;
  repeated WorkspacePromptCapability admitted_catalog = 10;
  string admission_receipt_id = 11;
}

enum PromptExperimentArm {
  PROMPT_EXPERIMENT_ARM_UNSPECIFIED = 0;
  PROMPT_EXPERIMENT_ARM_CONTROL = 1;
  PROMPT_EXPERIMENT_ARM_CANDIDATE = 2;
}

message PromptExperimentAssignment {
  string experiment_id = 1;
  string assignment_id = 2;
  PromptExperimentArm arm = 3;
  string artifact_id = 4;
  string artifact_version = 5;
  string artifact_sha256 = 6;
  string artifact_content = 7;
}

message ConfigurePromptExperimentMessage {
  PromptExperimentAssignment assignment = 1;
}

message ServerRequestResponseMessage {
  string request_id = 1;
  ServerRequestType request_type = 2;
  optional bool approved = 3;
  ToolResponseResult result = 4;
  optional ToolRetryDecisionAction decision_action = 5;
  optional string reason = 6;
  repeated ContentBlock content = 7;
  optional bool is_error = 8;
}

message UtilityCommandStartMessage {
  string command_id = 1;
  string command = 2;
  optional string cwd = 3;
  map<string, string> env = 4;
  optional UtilityCommandShellMode shell_mode = 5;
  optional UtilityCommandTerminalMode terminal_mode = 6;
  optional bool allow_stdin = 7;
  optional uint32 columns = 8;
  optional uint32 rows = 9;
}

message UtilityCommandTerminateMessage {
  string command_id = 1;
  optional bool force = 2;
}

message UtilityCommandStdinMessage {
  string command_id = 1;
  string content = 2;
  optional bool eof = 3;
}

message UtilityCommandResizeMessage {
  string command_id = 1;
  uint32 columns = 2;
  uint32 rows = 3;
}

message UtilityFileSearchMessage {
  string search_id = 1;
  string query = 2;
  optional string cwd = 3;
  optional uint32 limit = 4;
}

message UtilityFileReadMessage {
  string read_id = 1;
  string path = 2;
  optional string cwd = 3;
  optional uint32 offset = 4;
  optional uint32 limit = 5;
}

message UtilityFileWatchStartMessage {
  string watch_id = 1;
  optional string root_dir = 2;
  repeated string include_patterns = 3;
  repeated string exclude_patterns = 4;
  optional uint32 debounce_ms = 5;
}

message UtilityFileWatchStopMessage {
  string watch_id = 1;
}

message CancelMessage {}

message ShutdownMessage {}

message ReadyMessage {
  string protocol_version = 1;
  string model = 2;
  string provider = 3;
  optional string session_id = 4;
  ExecutorType executor_type = 5;
}

message ResponseStartMessage {
  string response_id = 1;
}

message ResponseChunkMessage {
  string response_id = 1;
  string content = 2;
  bool is_thinking = 3;
}

message AssistantTextObservedMessage {
  string response_id = 1;
}

message ResponseEndMessage {
  string response_id = 1;
  ResponseUsage usage = 2;
  ToolsSummary tools_summary = 3;
  uint32 duration_ms = 4;
  optional uint32 ttft_ms = 5;
}

message TurnCompletedMessage {
  string response_id = 1;
}

message TurnInterruptedMessage {
  string response_id = 1;
  string reason = 2;
}

enum ProviderStreamErrorKind {
  PROVIDER_STREAM_ERROR_KIND_UNSPECIFIED = 0;
  PROVIDER_STREAM_ERROR_KIND_TRANSIENT_PROTOCOL = 1;
  PROVIDER_STREAM_ERROR_KIND_OUTPUT_TOKEN_EXHAUSTION = 2;
  PROVIDER_STREAM_ERROR_KIND_INCOMPLETE_RESPONSE = 3;
  PROVIDER_STREAM_ERROR_KIND_PROVIDER_DECLARED_FAILURE = 4;
}

message ProviderErrorMessage {
  ProviderStreamErrorKind kind = 1;
  string message = 2;
}

message ToolCallMessage {
  string call_id = 1;
  string tool = 2;
  google.protobuf.Value args = 3;
  bool requires_approval = 4;
  optional string tool_execution_id = 5;
}

message ToolStartMessage {
  string call_id = 1;
}

message ToolOutputMessage {
  string call_id = 1;
  string content = 2;
}

message ToolEndMessage {
  string call_id = 1;
  bool success = 2;
  optional string tool = 3;
  google.protobuf.Value details = 4;
  optional string tool_execution_id = 5;
  google.protobuf.Value receipt = 6;
}

message ClientToolRequestMessage {
  string call_id = 1;
  string tool = 2;
  google.protobuf.Value args = 3;
  optional string tool_execution_id = 4;
}

message GovernedClientToolRequestMessage {
  string call_id = 1;
  string tool_execution_id = 2;
  string tool = 3;
  google.protobuf.Value args = 4;
  string provider_tool_name = 5;
  string tool_id = 6;
  string client_instance_id = 7;
  string grant_id = 8;
  uint64 grant_version = 9;
  string grant_hash = 10;
  string definition_digest = 11;
  string args_digest = 12;
  uint64 owner_lease_epoch = 13;
  string idempotency_key = 14;
  string turn_digest = 15;
  optional string connection_binding_id = 16;
}

message ServerRequestMessage {
  string request_id = 1;
  ServerRequestType request_type = 2;
  string call_id = 3;
  string tool = 4;
  optional string display_name = 5;
  optional string summary_label = 6;
  optional string action_description = 7;
  google.protobuf.Value args = 8;
  string reason = 9;
  optional uint64 started_at_ms = 10;
  optional string tool_execution_id = 11;
}

message ServerRequestResolvedMessage {
  string request_id = 1;
  ServerRequestType request_type = 2;
  string call_id = 3;
  ServerRequestResolution resolution = 4;
  optional string reason = 5;
  ServerRequestResolvedBy resolved_by = 6;
  optional uint64 started_at_ms = 7;
  optional uint64 resolved_at_ms = 8;
}

message UtilityCommandStartedMessage {
  string command_id = 1;
  string command = 2;
  optional string cwd = 3;
  UtilityCommandShellMode shell_mode = 4;
  UtilityCommandTerminalMode terminal_mode = 5;
  optional uint32 pid = 6;
  optional uint32 columns = 7;
  optional uint32 rows = 8;
  optional string owner_connection_id = 9;
}

message UtilityCommandResizedMessage {
  string command_id = 1;
  uint32 columns = 2;
  uint32 rows = 3;
}

message UtilityCommandOutputMessage {
  string command_id = 1;
  UtilityCommandStream stream = 2;
  string content = 3;
}

message UtilityCommandExitedMessage {
  string command_id = 1;
  bool success = 2;
  optional int32 exit_code = 3;
  optional string signal = 4;
  optional string reason = 5;
}

message UtilityFileSearchResultsMessage {
  string search_id = 1;
  string query = 2;
  string cwd = 3;
  repeated UtilityFileSearchMatch results = 4;
  bool truncated = 5;
}

message UtilityFileReadResultMessage {
  string read_id = 1;
  string path = 2;
  string relative_path = 3;
  string cwd = 4;
  string content = 5;
  uint32 start_line = 6;
  uint32 end_line = 7;
  uint32 total_lines = 8;
  bool truncated = 9;
}

message UtilityFileWatchStartedMessage {
  string watch_id = 1;
  string root_dir = 2;
  repeated string include_patterns = 3;
  repeated string exclude_patterns = 4;
  uint32 debounce_ms = 5;
  optional string owner_connection_id = 6;
}

message UtilityFileWatchEventMessage {
  string watch_id = 1;
  UtilityFileWatchChangeType change_type = 2;
  string path = 3;
  string relative_path = 4;
  uint64 timestamp = 5;
  bool is_directory = 6;
}

message UtilityFileWatchStoppedMessage {
  string watch_id = 1;
  optional string reason = 2;
}

message ErrorMessage {
  optional string request_id = 1;
  string message = 2;
  bool fatal = 3;
  ErrorType error_type = 4;
}

message StatusMessage {
  string message = 1;
}

message CompactionMessage {
  string summary = 1;
  uint32 first_kept_entry_index = 2;
  uint32 tokens_before = 3;
  bool auto = 4;
  optional string custom_instructions = 5;
  string timestamp = 6;
}

message SessionInfoMessage {
  optional string session_id = 1;
  string cwd = 2;
  optional string git_branch = 3;
}

message HelloOkMessage {
  string protocol_version = 1;
  optional string connection_id = 2;
  optional string client_protocol_version = 3;
  ClientInfo client_info = 4;
  ClientCapabilities capabilities = 5;
  repeated NotificationType opt_out_notifications = 6;
  optional ConnectionRole role = 7;
  optional string controller_connection_id = 8;
  optional string lease_expires_at = 9;
  ServerCapabilities server_capabilities = 10;
  optional string controller_binding_version = 11;
  optional string controller_binding_sha256 = 12;
}

message ConnectionInfoMessage {
  optional string connection_id = 1;
  optional string client_protocol_version = 2;
  ClientInfo client_info = 3;
  ClientCapabilities capabilities = 4;
  repeated NotificationType opt_out_notifications = 5;
  optional ConnectionRole role = 6;
  optional uint32 connection_count = 7;
  optional string controller_connection_id = 8;
  optional string lease_expires_at = 9;
  repeated ConnectionState connections = 10;
}

message ResponseAcceptedMessage {
  string request_id = 1;
}

message WorkspaceCapabilitySetAppliedMessage {
  string schema_version = 1;
  string organization_id = 2;
  string workspace_id = 3;
  string runner_session_id = 4;
  uint64 runtime_generation = 5;
  uint64 activation_generation = 6;
  string effective_catalog_digest = 7;
  repeated string accepted_entry_digests = 8;
  repeated string rejected_entries = 9;
  string replay_cursor = 10;
  uint64 applied_at = 11;
  string controller_binding_sha256 = 12;
  string provider_prompt_sha256 = 13;
  bool staged_for_next_turn = 14;
  bool idempotent = 15;
}

message RawAgentEventMessage {
  string event_type = 1;
  google.protobuf.Value event = 2;
}

message DelegationControlProjection {
  DelegationControlAction action = 1;
  DelegationControlState state = 2;
  optional string id = 3;
  optional string reason_code = 4;
}

message DelegationEventMessage {
  string schema_version = 1;
  string event_id = 2;
  string delegation_id = 3;
  optional string task_id = 4;
  optional uint32 attempt = 5;
  DelegationEventKind kind = 6;
  DelegationLifecycleState lifecycle_state = 7;
  string summary = 8;
  optional string reason_code = 9;
  repeated DelegationControlAction available_controls = 10;
  DelegationControlProjection control = 11;
  optional string open_url = 12;
  optional string occurred_at = 13;
}

message ToAgentEnvelope {
  oneof payload {
    HelloMessage hello = 1;
    InitMessage init = 2;
    PromptMessage prompt = 3;
    InterruptMessage interrupt = 4;
    ToolResponseMessage tool_response = 5;
    ClientToolResultMessage client_tool_result = 6;
    ServerRequestResponseMessage server_request_response = 7;
    UtilityCommandStartMessage utility_command_start = 8;
    UtilityCommandTerminateMessage utility_command_terminate = 9;
    UtilityCommandStdinMessage utility_command_stdin = 10;
    UtilityCommandResizeMessage utility_command_resize = 11;
    UtilityFileSearchMessage utility_file_search = 12;
    UtilityFileReadMessage utility_file_read = 13;
    UtilityFileWatchStartMessage utility_file_watch_start = 14;
    UtilityFileWatchStopMessage utility_file_watch_stop = 15;
    CancelMessage cancel = 16;
