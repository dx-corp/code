# cargo-deny configuration for the dependency-advisory CI gate.
#
# `cargo deny check` fails the build on ANY RustSec advisory
# (vulnerability, unmaintained, unsound, or yanked) unless it is explicitly
# listed in `advisories.ignore` below. This is intentional: silently
# tolerating "just a warning" advisories is how RUSTSEC-2026-0187 (lopdf
# stack overflow via deeply nested PDF objects, reachable through
# extract_document / sessions.rs / registry/execute.rs) sat in Cargo.lock
# with nothing ever gating it in CI.
#
# Accepting an advisory here is a real decision, not a rubber stamp:
# - Every entry MUST have a `reason` naming the crate, why it's not
#   currently fixable/exploitable here, and an inline `expires: YYYY-MM-DD`.
# - `scripts/check-advisory-expiry.mjs` (run in CI alongside this check)
#   parses that `expires:` marker and FAILS the build once it has passed,
#   so an accepted advisory can't be forgotten forever -- cargo-deny itself
#   has no native expiry mechanism, so we enforce it out-of-band.
# - When an entry expires, re-run `cargo audit` / `cargo tree -i <crate>`:
#   either the upstream crate has a fix (bump it, drop the ignore) or it
#   doesn't yet (extend the expiry with a fresh reason).

[graph]
targets = []

[advisories]
ignore = [
    # --- Unmaintained crates (no known vulnerability) ---
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.13.1 is unmaintained after its merge into zbus 6; retained by the Linux native credential-store chain keyring 4.2.0 -> zbus-secret-service-keyring-store 1.0.0 -> secret-service 5.1.0 -> zbus 5.18.0. Current published store 1.0.1 and secret-service 5.2.0 still require zbus ^5; no supported same-backend upgrade removes it. Preserve secure credential storage; remove this acceptance when the supported chain migrates to zbus 6, or re-review at expiry. Re-reviewed 2026-11-01: crates.io secret-service 5.2.0 (2026-08-29) still requires zbus ^5 and zbus-secret-service-keyring-store 1.0.1 has no zbus 6 release, so no supported upgrade removes it yet. expires: 2026-11-30" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 is unmaintained after its merge into zbus 6; retained by the Linux native credential-store chain keyring 4.2.0 -> zbus-secret-service-keyring-store 1.0.0 -> secret-service 5.1.0 -> zbus 5.18.0. Current published store 1.0.1 and secret-service 5.2.0 still require zbus ^5; no supported same-backend upgrade removes it. Preserve secure credential storage; remove this acceptance when the supported chain migrates to zbus 6, or re-review at expiry. Re-reviewed 2026-11-01: crates.io secret-service 5.2.0 (2026-08-29) still requires zbus ^5 and zbus-secret-service-keyring-store 1.0.1 has no zbus 6 release, so no supported upgrade removes it yet. expires: 2026-11-30" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.13.1 is unmaintained after its merge into zbus 6; retained by the Linux native credential-store chain keyring 4.2.0 -> zbus-secret-service-keyring-store 1.0.0 -> secret-service 5.1.0 -> zbus 5.18.0. Current published store 1.0.1 and secret-service 5.2.0 still require zbus ^5; no supported same-backend upgrade removes it. Preserve secure credential storage; remove this acceptance when the supported chain migrates to zbus 6, or re-review at expiry. Re-reviewed 2026-11-01: crates.io secret-service 5.2.0 (2026-08-29) still requires zbus ^5 and zbus-secret-service-keyring-store 1.0.1 has no zbus 6 release, so no supported upgrade removes it yet. expires: 2026-11-30" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained; current latest syntect 5.3.0 still requires bincode ^1 for the bundled syntax/theme assets enabled by tui-rs and tui-kit-rs. Observed TUI initialization loads bundled SyntaxSet/ThemeSet defaults; this does not establish safety for general untrusted bincode input. Remove this maintenance acceptance when a supported Syntect release replaces the serialization dependency while preserving bundled assets, or re-review at expiry. Re-reviewed 2026-11-01: crates.io syntect 5.3.0 still requires bincode ^1.0. expires: 2026-11-30" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is unmaintained; user PDF extraction remains reachable through pdf-extract 0.12.0 -> lopdf 0.42.0. Current latest pdf-extract 0.12.1 still requires lopdf ^0.42; lopdf 0.45 removes ttf-parser but lies outside that supported range. Retain the lopdf stack-overflow fix; remove this maintenance acceptance when a supported pdf-extract release adopts the maintained parser, or re-review at expiry. Re-reviewed 2026-11-01: crates.io pdf-extract 0.12.1 still requires lopdf ^0.42. expires: 2026-11-30" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
# Maestro's dex-loop -> jsonschema -> referencing -> fluent-uri edge uses
# the same MIT-0 crate already accepted by rust/deny.toml and Connectors.
# Keep this product allowance limited to the existing locked version.
exceptions = [
    { crate = "borrow-or-share@=0.2.4", allow = ["MIT-0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
