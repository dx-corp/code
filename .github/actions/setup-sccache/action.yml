name: Setup sccache
description: >
  Install sccache and select a backend. GCS on ARC when GCE metadata
  identity is present and an objects.list probe of evalops-prod-ci-sccache
  succeeds. Else local disk when the runner service exports
  SCCACHE_LOCAL_DIR to an absolute writable path, or Borg exports its owned
  BORG_CACHE_ROOT/sccache as SCCACHE_DIR (WSL:
  /var/cache/evalops-sccache, SCCACHE_CACHE_SIZE default 40G). GitHub
  Actions cache is an opt-out fallback for callers that still require it.
  Callers compile with RUSTC_WRAPPER=sccache.

inputs:
  version:
    description: sccache release tag consumed by mozilla-actions/sccache-action.
    required: false
    default: v0.15.0
  backend:
    description: >
      sccache storage backend. `auto` (default) probes the GCE metadata
      server and uses `gcs` when the runner identity answers and an
      objects.list probe of the sccache prefix returns HTTP 200; else
      `local` when SCCACHE_LOCAL_DIR or Borg's owned SCCACHE_DIR is writable;
      else `gha`. The GCS probe is GET .../b/<bucket>/o?maxResults=1&prefix=...
      (storage.objects.list), not buckets.get, because the runner GSA
      is roles/storage.objectUser. A 404 or 403 warns and falls back to
      local disk if configured, else `gha`. `gcs`, `local`, and `gha`
      force a backend, but `gcs` still falls back if the prefix is
      unusable and `local` still falls back if the dir is missing.
    required: false
    default: auto
  gcs-bucket:
    description: GCS bucket for the sccache compiler cache on ARC runners.
    required: false
    default: evalops-prod-ci-sccache
  rust-toolchain:
    description: >
      Rust toolchain used to namespace compiler objects. Callers that install
      a toolchain explicitly should pass the same value; repository
      rust-toolchain.toml or mise.toml remains the fallback.
    required: false
    default: ""
  wif-provider:
    description: >
      GitHub Actions workload identity provider for runners without a GCE
      identity (borg drones). Empty (default) keeps today's selection. The job
      needs `id-token: write`; any exchange failure falls back to local disk.
    required: false
    default: ""
  reader-service-account:
    description: Service account with read access to the sccache bucket, for every event except a push to main.
    required: false
    default: ""
  writer-service-account:
    description: Service account with write access to the sccache bucket, used only for a push to refs/heads/main.
    required: false
    default: ""
  allow-gha-fallback:
    description: >
      Permit auto/local selection to fall back to GitHub Actions cache when
      neither GCS nor persistent local disk is available. When false, use an
      ephemeral local cache instead and reject an explicit gha backend.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      with:
        version: ${{ inputs.version }}
        disable_annotations: true
    - name: Exchange GitHub OIDC for sccache bucket credentials
      id: wif
      if: ${{ inputs.wif-provider != '' && inputs.reader-service-account != '' }}
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        # Writes only from a push to main; every other event reads.
        service_account: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.writer-service-account != '') && inputs.writer-service-account || inputs.reader-service-account }}
        token_format: access_token
        create_credentials_file: true
        export_environment_variables: false
    - name: Configure sccache backend
      shell: bash
      env:
        SCCACHE_WIF_CREDENTIALS_FILE: ${{ steps.wif.outputs.credentials_file_path }}
        SCCACHE_WIF_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
        SCCACHE_BACKEND: ${{ inputs.backend }}
        SCCACHE_GCS_BUCKET_NAME: ${{ inputs.gcs-bucket }}
        SCCACHE_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        SCCACHE_ALLOW_GHA_FALLBACK: ${{ inputs.allow-gha-fallback }}
      run: bash "${GITHUB_ACTION_PATH}/configure.sh"
    - name: Link prebuilt AWS-LC when the runner has one
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/ci/aws-lc-system-env.sh"
