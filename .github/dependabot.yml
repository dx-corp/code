# GitHub Actions updates are managed by Mono's root Dependabot configuration.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "ci"
