name: release

# Not a GitHub Actions entrypoint. The live private tarball release is
# evalops/mono .github/workflows/maestro-release.yml.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semver (with or without leading v)
        required: true
      channel:
        description: Release channel; prerelease suffix must match
        required: false
        type: choice
        options: [stable, beta, alpha]
        default: stable

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Owned-capacity only. GitHub-hosted labels (ubuntu-*, macos-*) are billing-
# blocked / credit-capped for this org's private repos. Defaults:
#   linux-x64  → INTERNAL_CONFIRMATION_RUNNER (evalops-internal-arc)
#   linux-arm64 → same ARC lane, cross-compiled + qemu-user smoke when the
#                 runner arch is x86_64
#   darwin-*   → only when RELEASE_MACOS_X64_RUNNER / RELEASE_MACOS_ARM64_RUNNER
#                 (or RELEASE_MACOS_RUNNER) point at a real self-hosted macOS
#                 runner. No hosted macos-* fallback.

jobs:
  plan:
    runs-on: ${{ vars.INTERNAL_CONFIRMATION_RUNNER || 'evalops-internal-arc' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - id: matrix
        env:
          INTERNAL: ${{ vars.INTERNAL_CONFIRMATION_RUNNER || 'evalops-internal-arc' }}
          LINUX_ARM64: ${{ vars.RELEASE_LINUX_ARM64_RUNNER }}
          MACOS_X64: ${{ vars.RELEASE_MACOS_X64_RUNNER || vars.RELEASE_MACOS_RUNNER }}
          MACOS_ARM64: ${{ vars.RELEASE_MACOS_ARM64_RUNNER || vars.RELEASE_MACOS_RUNNER }}
        run: |
          set -euo pipefail
          # Fail closed on any hosted label — those burn Actions credits.
          deny_hosted() {
            local label="$1"
            case "$label" in
              ubuntu-*|macos-*|windows-*)
                echo "::error::Release runner label '$label' is GitHub-hosted. Set an owned self-hosted label (evalops-internal-arc / self-hosted macOS)."
                exit 1
                ;;
            esac
          }
          deny_hosted "$INTERNAL"
          linux_arm64_runner="${LINUX_ARM64:-$INTERNAL}"
          deny_hosted "$linux_arm64_runner"

          entries=()
          entries+=("$(jq -nc \
            --arg platform linux-x64 \
            --arg target x86_64-unknown-linux-gnu \
            --arg os "$INTERNAL" \
            --argjson cross false \
            '{platform:$platform,target:$target,os:$os,cross:$cross}')")
          entries+=("$(jq -nc \
            --arg platform linux-arm64 \
            --arg target aarch64-unknown-linux-gnu \
            --arg os "$linux_arm64_runner" \
            --argjson cross true \
            '{platform:$platform,target:$target,os:$os,cross:$cross}')")

          platforms="linux-x64 linux-arm64"

          if [[ -n "${MACOS_X64:-}" ]]; then
            deny_hosted "$MACOS_X64"
            entries+=("$(jq -nc \
              --arg platform darwin-x64 \
              --arg target x86_64-apple-darwin \
              --arg os "$MACOS_X64" \
              --argjson cross false \
              '{platform:$platform,target:$target,os:$os,cross:$cross}')")
            platforms+=" darwin-x64"
          else
            echo "::warning::RELEASE_MACOS_X64_RUNNER / RELEASE_MACOS_RUNNER unset; skipping darwin-x64 (no hosted macos-* fallback under credit cap)."
          fi

          if [[ -n "${MACOS_ARM64:-}" ]]; then
            deny_hosted "$MACOS_ARM64"
            entries+=("$(jq -nc \
              --arg platform darwin-arm64 \
              --arg target aarch64-apple-darwin \
              --arg os "$MACOS_ARM64" \
              --argjson cross false \
              '{platform:$platform,target:$target,os:$os,cross:$cross}')")
            platforms+=" darwin-arm64"
          else
            echo "::warning::RELEASE_MACOS_ARM64_RUNNER / RELEASE_MACOS_RUNNER unset; skipping darwin-arm64 (no hosted macos-* fallback under credit cap)."
          fi

          matrix="$(printf '%s\n' "${entries[@]}" | jq -cs '{include:.}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Release binary matrix: $matrix"
          echo "Platforms: $platforms"

  binaries:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-group: release-${{ matrix.platform }}
          targets: ${{ matrix.target }}
          workspaces: . -> target
      - id: private-cargo
        uses: ./.github/actions/configure-private-cargo-git
        with:
          token: ${{ secrets.EVALOPS_PR_LENS_TOKEN }}
          dependency-url: https://github.com/evalops/test-world
      - name: Require private Cargo credentials for release binary
        env:
          PRIVATE_CARGO_CONFIGURED: ${{ steps.private-cargo.outputs.configured }}
        run: test "$PRIVATE_CARGO_CONFIGURED" = true

      - name: Install linux-arm64 cross toolchain (owned x64 runners only)
        if: ${{ matrix.platform == 'linux-arm64' && matrix.cross }}
        run: |
          set -euo pipefail
          # When RELEASE_LINUX_ARM64_RUNNER is a real aarch64 host, cross is false
          # and this step is skipped. Default is ARC x64 → cross-compile.
          if [[ "$(uname -m)" == "aarch64" || "$(uname -m)" == "arm64" ]]; then
            echo "Runner is already aarch64; skipping cross toolchain."
            exit 0
          fi
          # ARC runners currently expose Ubuntu sources over HTTP, while the
          # delivery network only permits HTTPS. Build an isolated source-parts
          # directory so this repair does not mutate the runner image or
          # silently rewrite unrelated apt configuration. The package install
          # remains required and fail-closed if the bounded HTTPS refresh does
          # not succeed.
          apt_sources_dir="$RUNNER_TEMP/maestro-apt-sources"
          mkdir -p "$apt_sources_dir"
          source_count=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ ! -f "$source" ]]; then
              continue
            fi
            source_count=$((source_count + 1))
            sed \
              -e 's#http://archive.ubuntu.com#https://archive.ubuntu.com#g' \
              -e 's#http://security.ubuntu.com#https://security.ubuntu.com#g' \
              "$source" > "$apt_sources_dir/$(basename "$source")"
          done
          if [[ "$source_count" -eq 0 ]]; then
            echo "::error::No apt source files were available for the linux-arm64 cross-toolchain install."
            exit 1
          fi
          apt_options=(
            -o "Dir::Etc::sourcelist=/dev/null"
            -o "Dir::Etc::sourceparts=$apt_sources_dir"
            -o "Acquire::Retries=2"
            -o "Acquire::http::Timeout=10"
            -o "Acquire::https::Timeout=10"
          )
          sudo -n apt-get "${apt_options[@]}" update -qq
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static
          rustup target add aarch64-unknown-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build canonical native binary
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/build-release-binary.mjs --platform "$RELEASE_PLATFORM"

      - name: Smoke binary (native or qemu for cross-linux)
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          binary="dist/release/maestro-${RELEASE_PLATFORM}"
          host_arch="$(uname -m)"
          # Native smoke on matching arch.
          if [[ "$RELEASE_PLATFORM" == "linux-x64" && ( "$host_arch" == "x86_64" || "$host_arch" == "amd64" ) ]]; then
            node scripts/smoke-release-native-only.mjs "$binary"
            exit 0
          fi
          if [[ "$RELEASE_PLATFORM" == "linux-arm64" && ( "$host_arch" == "aarch64" || "$host_arch" == "arm64" ) ]]; then
            node scripts/smoke-release-native-only.mjs "$binary"
            exit 0
          fi
          if [[ "$RELEASE_PLATFORM" == darwin-* && "$(uname -s)" == "Darwin" ]]; then
            node scripts/smoke-release-native-only.mjs "$binary"
            exit 0
          fi
          # Cross-built linux-arm64 on x64 ARC: execute under qemu-user-static.
          if [[ "$RELEASE_PLATFORM" == "linux-arm64" && "$CROSS" == "true" ]]; then
            if ! command -v qemu-aarch64-static >/dev/null 2>&1; then
              echo "::error::qemu-aarch64-static missing; cannot smoke cross-built linux-arm64"
              exit 1
            fi
            # Headless version smoke under qemu (full native smoke needs matching arch).
            out="$(qemu-aarch64-static "$binary" --version)"
            echo "$out"
            echo "$out" | grep -q maestro
            qemu-aarch64-static "$binary" --help | grep -q Usage
            echo "qemu-aarch64-static smoke ok for $RELEASE_PLATFORM"
            exit 0
          fi
          echo "::error::No smoke path for platform=$RELEASE_PLATFORM host=$(uname -s)/$host_arch cross=$CROSS"
          exit 1

      - name: Record smoke marker
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          binary="dist/release/maestro-${PLATFORM}"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$binary" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$binary" | awk '{print $1}')"
          fi
          printf '%s  maestro-%s\n' "$digest" "$PLATFORM" > "dist/release/smoked-${PLATFORM}.txt"
          cat "dist/release/smoked-${PLATFORM}.txt"
          rustc -Vv > "dist/release/rustc-${PLATFORM}.txt"
      - name: Conformance against the exact release binary
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          binary="dist/release/maestro-${RELEASE_PLATFORM}"
          host_arch="$(uname -m)"
          if [[ "$RELEASE_PLATFORM" == "linux-arm64" && "$CROSS" == "true" && "$host_arch" != "aarch64" && "$host_arch" != "arm64" ]]; then
            node scripts/run-runtime-conformance.mjs \
              --binary "$binary" \
              --binary-launcher qemu-aarch64-static
          else
            node scripts/run-runtime-conformance.mjs --binary "$binary"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-${{ matrix.platform }}
          path: |
            dist/release/maestro-${{ matrix.platform }}
            dist/release/smoked-${{ matrix.platform }}.txt
            dist/release/rustc-${{ matrix.platform }}.txt

  publish:
    needs: [plan, binaries]
    # Same lane as linux-x64 build (INTERNAL_CONFIRMATION_RUNNER). Build and
    # publish must share glibc: ARC is Ubuntu Noble (2.39); static evalops-internal
    # is Debian 12 bookworm (~2.36). Mismatch fails packed smoke with GLIBC_2.39.
    runs-on: ${{ vars.INTERNAL_CONFIRMATION_RUNNER || 'evalops-internal-arc' }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # zizmor: ignore[cache-poisoning] no cache: input is set, so this step restores nothing
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: maestro-*
          path: release-binaries
          merge-multiple: true
      - name: Verify every shipped binary was smoke-tested
        env:
          MAESTRO_RELEASE_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: node scripts/verify-release-smoke-coverage.mjs release-binaries
      - name: Conformance against the exact native release artifact
        run: node scripts/run-runtime-conformance.mjs --binary release-binaries/maestro-linux-x64
      - name: Generate signed-release passport inputs
        env:
          MAESTRO_RELEASE_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          compatibility_digest="$(jq -r '.compatibilityDigest' proto/maestro/v1/protocol-compatibility-manifest.json)"
          for platform in $MAESTRO_RELEASE_PLATFORMS; do
            case "$platform" in
              linux-x64) target="x86_64-unknown-linux-gnu" ;;
              linux-arm64) target="aarch64-unknown-linux-gnu" ;;
              darwin-x64) target="x86_64-apple-darwin" ;;
              darwin-arm64) target="aarch64-apple-darwin" ;;
              *) echo "unsupported release platform: $platform" >&2; exit 1 ;;
            esac
            digest="sha256:$(sha256sum "release-binaries/maestro-${platform}" | awk '{print $1}')"
            rustc_identity="$(cat "release-binaries/rustc-${platform}.txt")"
            node scripts/generate-runtime-passport.mjs \
              --artifact-kind native_binary \
              --artifact-name "maestro-${platform}" \
              --artifact-digest "$digest" \
              --source-sha "$SOURCE_SHA" \
              --compatibility-digest "$compatibility_digest" \
              --launch-spec-version evalops.maestro.hosted-launch-spec.v1 \
              --receipt-version evalops.maestro.runtime-receipt.v1 \
              --rustc "$rustc_identity" \
              --target "$target" \
              --behavior-profile hosted-http-sse-v1 \
              --out "runtime-passport-maestro-${platform}.json"
          done
      - name: Resolve release version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version || github.ref_name }}
        run: echo "value=${REQUESTED#v}" >> "$GITHUB_OUTPUT"
      - name: Resolve release channel
        id: channel
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          REQUESTED: ${{ github.event.inputs.channel || '' }}
        run: echo "value=$(node scripts/resolve-release-channel.mjs --version "$RELEASE_VERSION" --requested "$REQUESTED")" >> "$GITHUB_OUTPUT"
      - name: Generate signed release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/create-release-metadata.mjs \
            --version "$RELEASE_VERSION" \
            --release-tag "v$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --out release-metadata.json
      - name: Generate signed release channel manifest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.value }}
          CHANNEL_KEY_ID: ${{ steps.channel.outputs.value == 'stable' && 'stable-2026-08-0c3df2ac' || 'preview-2026-08-912a0dab' }}
          MAESTRO_CHANNEL_PRIVATE_KEY: ${{ steps.channel.outputs.value == 'stable' && secrets.MAESTRO_STABLE_CHANNEL_PRIVATE_KEY || secrets.MAESTRO_PREVIEW_CHANNEL_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/create-release-channel-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --key-id "$CHANNEL_KEY_ID" \
            --release-url "https://github.com/evalops/maestro/releases/download/v$RELEASE_VERSION" \
            --metadata-url "https://github.com/evalops/maestro/releases/download/v$RELEASE_VERSION/release-metadata.json" \
            --metadata-file release-metadata.json \
            --source-sha "$SOURCE_SHA" \
            --out channel-manifest.json
      - name: Verify native package inputs
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test -f packages/web/dist/index.html
          npm run check:rust-only-runtime
      - name: Materialize native npm package
        run: node scripts/materialize-native-package.mjs --input-dir release-binaries
      - name: Package browser assets for native installs
        run: tar -czf maestro-web-dist.tar.gz -C packages/web/dist .
      - id: pack
        run: |
          PACK_JSON=$(npm pack --json)
          echo "$PACK_JSON"
          echo "tarball=$(echo "$PACK_JSON" | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"
      - name: Smoke packed package without JS runtime
        run: node scripts/smoke-release-native-only.mjs bin/maestro

      - name: Install syft
        run: |
          set -euo pipefail
          # Pinned by version and checksum: this is a supply-chain workflow and
          # `curl | sh` against a mutable tag would undercut the point of it.
          syft_version="1.33.0"
          syft_sha256="adc1b944a827ed3432bcd9f1dbdbc8fa3c0dca7d3d449e7084c90248c2c6cb50"
          tarball="$RUNNER_TEMP/syft.tar.gz"
          curl -fsSL --max-time 180 --retry 2 --retry-delay 5 -o "$tarball" \
            "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_linux_amd64.tar.gz"
          echo "${syft_sha256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/syftbin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/syftbin" syft
          echo "$RUNNER_TEMP/syftbin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/syftbin/syft" --version

      - name: Generate CycloneDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          sbom="maestro-${VERSION}.sbom.cdx.json"
          syft scan file:Cargo.lock -o "cyclonedx-json=${sbom}" -q
          components="$(node -p "require('./${sbom}').components.length")"
          echo "SBOM components: ${components}"
          # Fail closed: a truncated or empty SBOM is worse than none, because
          # it looks like coverage. Cargo.lock carries 616 crates.
          if [ "${components}" -lt 500 ]; then
            echo "::error::SBOM lists ${components} components; expected the full Cargo.lock graph" >&2
            exit 1
          fi

      - name: Install cosign
        run: |
          set -euo pipefail
          cosign_version="2.6.1"
          cosign_sha256="064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a"
          mkdir -p "$RUNNER_TEMP/cosignbin"
          curl -fsSL --max-time 180 --retry 2 --retry-delay 5 \
            -o "$RUNNER_TEMP/cosignbin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${cosign_version}/cosign-linux-amd64"
          echo "${cosign_sha256}  $RUNNER_TEMP/cosignbin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosignbin/cosign"
          echo "$RUNNER_TEMP/cosignbin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cosignbin/cosign" version

      - name: Checksum every release artifact
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          files=()
          for platform in $PLATFORMS; do
            cp "release-binaries/maestro-${platform}" .
            files+=("maestro-${platform}")
            files+=("runtime-passport-maestro-${platform}.json")
          done
          files+=("maestro-web-dist.tar.gz" "maestro-${VERSION}.sbom.cdx.json" "${TARBALL}" "release-metadata.json" "channel-manifest.json")
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign release artifacts with cosign
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          # Keyless / OIDC. No private key exists to leak or rotate: the
          # signing identity is this workflow's own OIDC token, and the
          # certificate binds the signature to
          # github.com/evalops/mono/.github/workflows/maestro-release.yml.
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          for platform in $PLATFORMS; do
            cosign sign-blob --yes \
              --bundle "maestro-${platform}.cosign.bundle" \
              "maestro-${platform}"
            cosign sign-blob --yes \
              --bundle "runtime-passport-maestro-${platform}.cosign.bundle" \
              "runtime-passport-maestro-${platform}.json"
          done
          ls -la ./*.cosign.bundle

      - name: Verify the signatures we just produced
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          identity="^https://github.com/evalops/mono/\\.github/workflows/maestro-release.yml@"
          verify() {
            cosign verify-blob \
              --bundle "$2" \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$1"
          }
          verify SHA256SUMS SHA256SUMS.cosign.bundle
          for platform in $PLATFORMS; do
            verify "maestro-${platform}" "maestro-${platform}.cosign.bundle"
            verify "runtime-passport-maestro-${platform}.json" "runtime-passport-maestro-${platform}.cosign.bundle"
          done
          sha256sum -c SHA256SUMS
          echo "All release signatures verified."

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Maestro ${{ steps.version.outputs.value }}
          generate_release_notes: true
          # Globs cover whichever platforms the plan job selected (linux always;
          # darwin only when self-hosted macOS runners are configured).
          files: |
            ${{ steps.pack.outputs.tarball }}
            release-binaries/maestro-*
            maestro-web-dist.tar.gz
            maestro-${{ steps.version.outputs.value }}.sbom.cdx.json
            SHA256SUMS
            SHA256SUMS.cosign.bundle
            release-metadata.json
            channel-manifest.json
            maestro-*.cosign.bundle
            runtime-passport-maestro-*.json
            runtime-passport-maestro-*.cosign.bundle
