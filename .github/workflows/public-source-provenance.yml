name: public-source-provenance

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] this job never checks out or executes pull-request code
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: public-source-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  require-internal-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check mirrored-source provenance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" == sync/* ]]; then
            if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "::error::Generated public sync PRs must come from ${REPOSITORY}, not ${HEAD_REPOSITORY}."
              exit 1
            fi

            case "$HEAD_REF" in
              sync/public-release-mirror|sync/release-mirror)
                ;;
              *)
                echo "::error::Unexpected generated sync branch '${HEAD_REF}'. Expected sync/public-release-mirror or sync/release-mirror."
                exit 1
                ;;
            esac

            if ! grep -Eiq "sync-public-release-mirror" <<< "${PR_BODY:-}"; then
              echo "::error::Generated public sync PR is missing sync-public-release-mirror provenance in its body."
              exit 1
            fi

            if ! grep -Eiq "internal source SHA: \`?[0-9a-f]{40}\`?" <<< "${PR_BODY:-}"; then
              echo "::error::Generated public sync PR is missing the internal source SHA."
              exit 1
            fi

            if [[ "$HEAD_REF" == "sync/public-release-mirror" ]]; then
              if ! grep -Eiq "Source-of-truth status|Public Mirror Drift Audit" <<< "${PR_BODY:-}"; then
                echo "::error::Generated public-tree sync PR is missing source-of-truth status details."
                exit 1
              fi
              if ! grep -Eiq "public-only commits since last generated sync" <<< "${PR_BODY:-}"; then
                echo "::error::Generated public-tree sync PR is missing public-only commit accounting."
                exit 1
              fi
            fi

            echo "Generated public sync provenance found."
            exit 0
          fi

          mapfile -t changed_files < <(
            gh api --paginate "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq ".[].filename"
          )

          mirrored_files=()
          for file_path in "${changed_files[@]}"; do
            case "$file_path" in
              .github/actionlint.yaml|\
              .github/workflows/*|\
              .github/release-mirror-manifest.json|\
              .github/public-release-mirror.exclude|\
              docs/release-ops.md|\
              docs/internal/*|\
              scripts/configure-npm-trusted-publisher.mjs|\
              scripts/deprecate-release.js|\
              scripts/smoke-registry-install.js|\
              scripts/validate-public-package-deps.js)
                continue
                ;;
            esac
            mirrored_files+=("$file_path")
          done

          if [[ "${#mirrored_files[@]}" -eq 0 ]]; then
            echo "No mirrored source files changed."
            exit 0
          fi

          if grep -Eiq "(https://github[.]com/(dx-corp|evalops)/(mono|maestro-internal)/pull/[0-9]+|(dx-corp|evalops)/(mono|maestro-internal)#[0-9]+|maestro-internal#[0-9]+)" <<< "${PR_BODY:-}"; then
            echo "Mirrored source provenance link found."
            exit 0
          fi

          marker="<!-- public-source-provenance -->"
          file_list="$(printf -- "- %s\n" "${mirrored_files[@]}" | head -n 25)"
          if [[ "${#mirrored_files[@]}" -gt 25 ]]; then
            file_list="$(printf "%s\n- ... %d more" "$file_list" "$((${#mirrored_files[@]} - 25))")"
          fi

          # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters in the printf format.
          printf -v comment_body '%s\nThis PR changes mirrored Maestro source files in the public repo, but it does not link the matching private source-of-truth PR.\n\nLink the matching dx-corp/mono source PR (legacy evalops and maestro-internal links remain accepted), then re-run the check:\n\n- `https://github.com/dx-corp/mono/pull/<number>`\n- `dx-corp/mono#<number>`\n- `maestro-internal#<number>`\n\nMirrored files touched:\n\n%s' \
            "$marker" "$file_list"

          existing_comment_id="$(
            gh api "/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" |
              head -n 1
          )"

          if [[ -n "$existing_comment_id" ]]; then
            gh api \
              --method PATCH \
              "/repos/${REPOSITORY}/issues/comments/${existing_comment_id}" \
              -f body="$comment_body" >/dev/null
          else
            gh api \
              --method POST \
              "/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$comment_body" >/dev/null
          fi

          echo "::error::Public PRs that touch mirrored source must link the matching dx-corp/mono source PR."
          exit 1

  report-fork-status:
    name: Report unvalidated fork PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Publish blocking not-validated status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          DESCRIPTION = "not validated: fork code is not run on trusted runners"
          SHA_PATTERN = re.compile(r"[0-9a-f]{40}")
          REPOSITORY_PATTERN = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
          MAX_MERGEABILITY_READS = 3
          API_TIMEOUT_SECONDS = 10

          def fail(message):
              raise RuntimeError(message)

          def valid_repository(value):
              return isinstance(value, str) and REPOSITORY_PATTERN.fullmatch(value) is not None

          def valid_sha(value):
              return isinstance(value, str) and SHA_PATTERN.fullmatch(value) is not None

          def api(arguments):
              try:
                  response = subprocess.run(
                      ["gh", *arguments],
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=API_TIMEOUT_SECONDS,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail("GitHub API request failed or timed out")
              if response.returncode != 0:
                  fail("GitHub API request failed")
              try:
                  return json.loads(response.stdout)
              except json.JSONDecodeError:
                  fail("GitHub API returned malformed JSON")

          def load_pull_request(repository, number):
              pull_request = api(["api", f"repos/{repository}/pulls/{number}"])
              if not isinstance(pull_request, dict):
                  fail("GitHub returned malformed pull-request metadata")
              if type(pull_request.get("number")) is not int or pull_request["number"] != number:
                  fail("GitHub returned a different pull request")
              if pull_request.get("state") not in {"open", "closed"}:
                  fail("GitHub returned malformed pull-request state")

              base = pull_request.get("base")
              base_repository = base.get("repo") if isinstance(base, dict) else None
              if not isinstance(base_repository, dict) or base_repository.get("full_name") != repository:
                  fail("GitHub returned pull-request metadata for a different repository")

              head = pull_request.get("head")
              if not isinstance(head, dict) or not valid_sha(head.get("sha")):
                  fail("GitHub returned malformed pull-request head metadata")
              if "repo" not in head:
                  fail("GitHub returned malformed pull-request head repository metadata")
              head_repository = head["repo"]
              if head_repository is None:
                  head_repository_name = None
              elif isinstance(head_repository, dict) and valid_repository(head_repository.get("full_name")):
                  head_repository_name = head_repository["full_name"]
              else:
                  fail("GitHub returned malformed pull-request head repository metadata")

              mergeable = pull_request.get("mergeable")
              if mergeable is not None and type(mergeable) is not bool:
                  fail("GitHub returned malformed mergeability metadata")
              return pull_request, head_repository_name

          def publish_failure(repository, sha):
              if not valid_sha(sha):
                  fail("Refusing to publish a status for an invalid SHA")
              status = api(
                  [
                      "api",
                      "--method",
                      "POST",
                      f"repos/{repository}/statuses/{sha}",
                      "-f",
                      "state=failure",
                      "-f",
                      "context=maestro-ci",
                      "-f",
                      f"description={DESCRIPTION}",
                  ]
              )
              if (
                  not isinstance(status, dict)
                  or status.get("state") != "failure"
                  or status.get("context") != "maestro-ci"
                  or status.get("description") != DESCRIPTION
              ):
                  fail("GitHub did not confirm the blocking not-validated status")

          def main():
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              if not valid_repository(repository):
                  fail("Invalid base repository")

              try:
                  with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                      event = json.load(event_file)
              except (OSError, KeyError, json.JSONDecodeError):
                  fail("GitHub event payload is unavailable or malformed")
              if not isinstance(event, dict):
                  fail("GitHub event payload is malformed")

              event_repository = event.get("repository")
              event_pull_request = event.get("pull_request")
              if not isinstance(event_repository, dict) or event_repository.get("full_name") != repository:
                  fail("Event repository does not match the workflow repository")
              if not isinstance(event_pull_request, dict):
                  fail("Event does not contain pull-request metadata")
              event_number = event.get("number")
              pull_request_number = event_pull_request.get("number")
              if (
                  type(event_number) is not int
                  or event_number <= 0
                  or type(pull_request_number) is not int
                  or pull_request_number != event_number
              ):
                  fail("Event pull-request number is invalid")

              event_base = event_pull_request.get("base")
              event_base_repository = event_base.get("repo") if isinstance(event_base, dict) else None
              if not isinstance(event_base_repository, dict) or event_base_repository.get("full_name") != repository:
                  fail("Event pull request targets a different repository")

              event_head = event_pull_request.get("head")
              if not isinstance(event_head, dict) or not valid_sha(event_head.get("sha")):
                  fail("Event pull-request head SHA is invalid")
              event_sha = event_head["sha"]
              if "repo" not in event_head:
                  fail("Event pull-request head repository metadata is missing")
              event_head_repository = event_head["repo"]
              if event_head_repository is None:
                  event_head_repository_name = None
              elif isinstance(event_head_repository, dict) and valid_repository(event_head_repository.get("full_name")):
                  event_head_repository_name = event_head_repository["full_name"]
              else:
                  fail("Event pull-request head repository metadata is malformed")

              current, current_head_repository = load_pull_request(repository, event_number)
              current_sha = current["head"]["sha"]
              if current_sha != event_sha:
                  print("Stale pull-request event; no status was written.")
                  return
              if (
                  event_head_repository_name is not None
                  and current_head_repository is not None
                  and event_head_repository_name != current_head_repository
              ):
                  print("Stale pull-request repository event; no status was written.")
                  return
              if current["state"] != "open":
                  print("Pull request is no longer open; no status was written.")
                  return
              if current_head_repository == repository:
                  print("Same-repository pull request; no status was written.")
                  return

              publish_failure(repository, current_sha)
              print("Published the blocking not-validated status on the current fork head.")

              if current["mergeable"] is False:
                  print("Pull request is not mergeable; the head status remains blocking.")
                  return

              latest = current
              latest_head_repository = current_head_repository
              for attempt in range(MAX_MERGEABILITY_READS):
                  if latest["mergeable"] is None:
                      time.sleep(0.25)
                  latest, latest_head_repository = load_pull_request(repository, event_number)
                  if (
                      latest["head"]["sha"] != event_sha
                      or latest["state"] != "open"
                      or latest_head_repository == repository
                      or (
                          event_head_repository_name is not None
                          and latest_head_repository is not None
                          and event_head_repository_name != latest_head_repository
                      )
                  ):
                      print("Pull request changed; the head status remains blocking.")
                      return
                  if latest["mergeable"] is not None:
                      break

              if latest["mergeable"] is not True:
                  if latest["mergeable"] is False:
                      print("Pull request is no longer mergeable; the head status remains blocking.")
                      return
                  fail("Mergeability remained unknown after bounded reads")

              merge_sha = latest.get("merge_commit_sha")
              if not valid_sha(merge_sha):
                  fail("GitHub returned an invalid current test merge SHA")
              publish_failure(repository, merge_sha)
              print("Published the blocking not-validated status on the current test merge commit.")

          try:
              main()
          except RuntimeError as error:
              print(str(error), file=sys.stderr)
              sys.exit(1)
          PY
