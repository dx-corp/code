name: GHCR Publish

# Publish the source commit as an immutable image, then update branch tags.

on:
  push:
    branches:
      - main

# Main image publishes rewrite the shared `main`/`latest` tags. Cancelling an
# in-flight push when the next mirror lands leaves incomplete blobs and produces
# intermittent GHCR 403 / "blob not found" failures.
concurrency:
  group: ghcr-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public Code publication uses its own image namespace.
  IMAGE_NAME: ghcr.io/dx-corp/code

jobs:
  publish-image:
    runs-on: ${{ vars.PUBLIC_RELEASE_RUNNER || 'ubuntu-latest' }}
    # Allow cold cache transfers and serial Rust compilation on owned runners.
    # Keep the publication budget bounded while the build limits memory use.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Use the org/repo owner as the GHCR username. github.actor can be a bot or
      # human depending on the merge path; the linked package is org-scoped and
      # GITHUB_TOKEN package write is granted for the repository, not the actor.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Push immutable sha- tags first so a race on mutable main/latest tags does
      # not drop the only reference to this build. Then move main/latest.
      - name: Build and push immutable image tag
        id: push-sha
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Retag main and latest from the immutable digest
        id: retag
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.push-sha.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::Build/push did not produce an image digest."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid immutable image identity."
            exit 1
          fi
          short_sha="${SOURCE_SHA:0:7}"
          source_ref="${IMAGE_NAME}@${DIGEST}"
          # Check the remote, including on retries: an older rerun must not rewind aliases.
          attempt=1
          while true; do
            live_main_ref="$(timeout 30s git \
              -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              ls-remote --exit-code origin refs/heads/main)" || {
              echo "::error::Cannot read current main; refusing to update image aliases."
              exit 1
            }
            if [[ ! "$live_main_ref" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/main$ ]]; then
              echo "::error::Malformed current main response; refusing to update image aliases."
              exit 1
            fi
            live_main_sha="${BASH_REMATCH[1]}"
            echo "live_main_sha=${live_main_sha}" >> "$GITHUB_OUTPUT"
            if [[ "$live_main_sha" != "$SOURCE_SHA" ]]; then
              echo "aliases_updated=false" >> "$GITHUB_OUTPUT"
              echo "Immutable image published; skipping aliases because current main is ${live_main_sha}."
              exit 0
            fi
            # Retries absorb intermittent GHCR intermediary 403s without rebuilding.
            if docker buildx imagetools create \
              --tag "${IMAGE_NAME}:main" \
              --tag "${IMAGE_NAME}:latest" \
              --tag "${IMAGE_NAME}:sha-${short_sha}" \
              "${source_ref}"; then
              break
            fi
            if [[ "$attempt" -ge 4 ]]; then
              echo "::error::Failed to retag ${source_ref} after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::GHCR retag attempt ${attempt} failed; retrying..."
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done
          echo "aliases_updated=true" >> "$GITHUB_OUTPUT"
          echo "Published ${source_ref} as main, latest, and sha-${short_sha}."

      - name: Summarize published image
        env:
          ALIASES_UPDATED: ${{ steps.retag.outputs.aliases_updated }}
          LIVE_MAIN_SHA: ${{ steps.retag.outputs.live_main_sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.push-sha.outputs.digest }}
        run: |
          set -euo pipefail
          : "${IMAGE_NAME:?Published image name is unavailable}"
          : "${SOURCE_SHA:?Published source revision is unavailable}"
          : "${DIGEST:?Published image digest is unavailable}"
          if [[ "$ALIASES_UPDATED" != true && "$ALIASES_UPDATED" != false ]]; then
            echo "::error::Image alias result is unavailable."
            exit 1
          fi
          {
            printf '%s\n\n' '## Published image'
            printf -- '- Commit tag: %s:sha-%s\n' "$IMAGE_NAME" "$SOURCE_SHA"
            printf -- '- Digest: %s@%s\n' "$IMAGE_NAME" "$DIGEST"
            if [[ "$ALIASES_UPDATED" == true ]]; then
              printf -- '- Updated tags: main, latest, sha-%s\n' "${SOURCE_SHA:0:7}"
            else
              printf -- '- Alias update not completed: main, latest, sha-%s (current main: %s)\n' "${SOURCE_SHA:0:7}" "$LIVE_MAIN_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
