[package]
name = "maestro"
version = "0.10.111"
edition = "2021"
license = "MIT"
description = "Canonical native Rust CLI for Deixic Code"

[[bin]]
name = "maestro"
path = "src/main.rs"

[[bin]]
name = "maestro-local-sdk-conformance"
path = "src/bin/local_sdk_conformance.rs"
required-features = ["test-support"]

[lib]
name = "maestro"
path = "src/lib.rs"

[features]
default = []
# Builds the deterministic local-stdio conformance fixture. The production
# `maestro` binary never enables this feature.
test-support = ["maestro-tui/test-support"]

[dependencies]
anyhow.workspace = true
ctor.workspace = true
maestro-runtime-gateway.workspace = true
maestro-local-host.workspace = true
maestro-runtime.workspace = true
maestro-tui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util"] }

[dev-dependencies]
dunce.workspace = true
serde.workspace = true
maestro-runtime-contracts.workspace = true
