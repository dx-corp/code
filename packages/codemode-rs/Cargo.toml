[package]
name = "agent-codemode"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded native script orchestration over caller-owned tool dispatch"

[dependencies]
base64 = "0.22"
rquickjs = { version = "=0.13.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
