[package]
name = "maestro-ai"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI provider client layer for Deixic Code (Anthropic, Bedrock, OpenAI, Google, Vertex)"

[lib]
name = "maestro_ai"
path = "src/lib.rs"

[dependencies]
sha2.workspace = true
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
base64.workspace = true
futures.workspace = true
maestro-runtime-contracts.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing.workspace = true
uuid.workspace = true

# SSE streaming for OpenAI Responses / Anthropic / Google APIs
eventsource-stream.workspace = true

# 1Password `op://` credential resolution (op_secret.rs)
wait-timeout.workspace = true

# Backs `op_secret::test_support::FakeOp`, gated by `#[cfg(any(test, feature
# = "test-support"))]`. Optional so non-test builds of this crate (and of
# downstream crates that depend on it without the feature) don't carry it.
tempfile = { workspace = true, optional = true }

[features]
default = ["bedrock"]
bedrock = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-smithy-types",
    "dep:aws-types",
]
# Exposes `op_secret::test_support` to downstream crates' own test builds
# (e.g. maestro-tui's `doctor.rs` auth-health tests), which can no longer
# reach a `#[cfg(test)]`-only item across a crate boundary.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
