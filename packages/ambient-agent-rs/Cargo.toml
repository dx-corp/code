[package]
name = "ambient-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Always-on GitHub agent that watches repositories and ships code autonomously"

[lib]
name = "ambient_agent"
path = "src/lib.rs"

[[bin]]
name = "ambient"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "process", "time"] }
tokio-stream.workspace = true
futures.workspace = true

# HTTP client for GitHub API and AI
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls"] }
async-nats = "0.48"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap.workspace = true

# Async traits
async-trait = "0.1"

# Utilities
rand = "0.10"
uuid.workspace = true
chrono = { workspace = true, features = ["serde"] }
sha2.workspace = true
hex = "0.4"
regex.workspace = true
glob.workspace = true
dirs.workspace = true
dunce.workspace = true

# GitHub
octocrab = "0.41"

[dev-dependencies]
tokio-test = "0.4"
tempfile.workspace = true
