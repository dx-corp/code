[package]
name = "maestro-runtime-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust HTTP runtime gateway for Deixic Code"

[[bin]]
name = "maestro-runtime-gateway"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dunce.workspace = true
fs2 = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
getrandom = "0.4"
libc.workspace = true
maestro-a2a-ledger.workspace = true
maestro-runtime.workspace = true
maestro-local-host = { workspace = true, features = ["runtime-gateway-bridge"] }
pdf-extract.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "fs"] }
tokio-util = "0.7"
zip.workspace = true

[dev-dependencies]
maestro-local-host = { workspace = true, features = ["runtime-gateway-bridge", "test-support"] }
tempfile.workspace = true
